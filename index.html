<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adobe Photoshop Certification Complete Practice Test</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172b42;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}header{background:#075a9c;color:white;padding:26px 18px}header .inner,main{max-width:920px;margin:auto}h1{font-size:28px;margin:0 0 8px}header p{margin:0;color:#d8eafa}main{padding:20px 15px 70px}.toolbar{position:sticky;top:0;z-index:2;background:#fff;border:1px solid #d8e1ed;border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px #0c254020}.bar{height:9px;border-radius:10px;background:#e2eaf4;flex:1;min-width:120px;overflow:hidden}.bar span{display:block;height:100%;background:#1482c7;width:0;transition:width .2s}.question{background:white;border:1px solid #d8e1ed;border-radius:12px;margin:17px 0;padding:22px}.tag{font-size:12px;color:#64758b;font-weight:700;letter-spacing:.04em;text-transform:uppercase}h2{font-size:18px;line-height:1.45;margin:10px 0}.instruction{font-size:13px;color:#5d6b80}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid #d3dce8;background:#f7f9fc;border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;line-height:1.4}.option:has(input:checked){border-color:#1685d0;background:#e8f4ff}.option input{margin-top:3px;accent-color:#0877b8}.option.correct{background:#d9f5e5;border-color:#159656}.option.wrong{background:#ffe4e5;border-color:#d73b43}.feedback{font-size:14px;font-weight:700;margin:10px 0 0}.ok{color:#087c48}.bad{color:#c52e36}button{border:0;background:#0875ba;color:white;border-radius:8px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#e5eef6;color:#125079}#result{font-size:22px;font-weight:700;margin:20px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}@media print{header{color:black;background:white}.toolbar,.actions{display:none}.question{break-inside:avoid;box-shadow:none}body{background:white}}
</style></head><body><header><div class="inner"><h1>Adobe Photoshop Certification — Complete Practice Test</h1><p>83 questions • Parts 1–4 combined • Multiple choice and select-all-that-apply • Works offline • Scores shown only to students</p></div></header><main><div class="toolbar"><strong id="progress">0 / 83 complete</strong><div class="bar"><span id="fill"></span></div><button onclick="grade()">Grade Test</button></div><div id="quiz"></div><div class="actions"><button onclick="grade()">Submit & Grade All 83</button><button class="secondary" onclick="resetTest()">Retake Test</button></div><div id="result" aria-live="polite"></div></main><script>const qs=[{"q": "Which term describes a creation of the mind?", "opts": ["Attribution", "Intellectual Property", "Usage rights", "Public Domain"], "ans": [1], "part": 1}, {"q": "What is the term for crediting the original creator?", "opts": ["Copyright", "Public Domain", "Attribution", "Usage rights"], "ans": [2], "part": 1}, {"q": "Which Photoshop feature allows non-destructive filter editing?", "opts": ["Regular Filter", "Rasterize Layer", "Flatten Image", "Smart Filter"], "ans": [3], "part": 1}, {"q": "Which layer type contains editable text?", "opts": ["Type Layer", "Pixel Layer", "Shape Layer", "Adjustment Layer"], "ans": [0], "part": 1}, {"q": "What is the purpose of a layer mask?", "opts": ["Permanently erase pixels", "Convert a layer to text", "Hide or reveal portions of a layer", "Change document resolution"], "ans": [2], "part": 1}, {"q": "What controls spacing between two specific characters?", "opts": ["Leading", "Kerning", "Tracking", "Baseline"], "ans": [1], "part": 1}, {"q": "What controls spacing between lines of text?", "opts": ["Tracking", "Kerning", "Baseline", "Leading"], "ans": [3], "part": 1}, {"q": "The Magic Wand selects pixels based on color similarities.", "opts": ["True", "False"], "ans": [0], "part": 1}, {"q": "The Rectangular Marquee is the only marquee tool available.", "opts": ["True", "False"], "ans": [1], "part": 1}, {"q": "Which tool lightens selected areas of an image?", "opts": ["Burn", "Smudge", "Dodge", "Sponge"], "ans": [2], "part": 1}, {"q": "Which tool adjusts color saturation?", "opts": ["Sponge", "Burn", "Dodge", "Smudge"], "ans": [0], "part": 1}, {"q": "Which two portions of a Photoshop document can be exported as JPG files?", "opts": ["Artboards", "Effects alone", "Layers", "Guides"], "ans": [0, 2], "part": 1}, {"q": "Which two deliverables are typically provided to clients during a design project?", "opts": ["Project specifications", "Resource allocation", "Design comps", "Employee schedules"], "ans": [0, 2], "part": 1}, {"q": "Which Path Operation cuts one shape out of another?", "opts": ["Combine Shapes", "Subtract Front Shape", "Merge Shape Components", "Intersect Shape Areas"], "ans": [1], "part": 1}, {"q": "What is the main subject or area of attention in a photo called?", "opts": ["Field of view", "Space", "Framing", "Focal point"], "ans": [3], "part": 1}, {"q": "Which two choices improve visual hierarchy?", "opts": ["Font and font size", "Repetition", "Symmetry", "Color"], "ans": [0, 3], "part": 1}, {"q": "Which aspect ratio is commonly used for widescreen displays?", "opts": ["4:3", "16:9", "1:1", "2.39:1"], "ans": [1], "part": 1}, {"q": "Which principle describes visually pleasing relationships among design elements?", "opts": ["Harmony", "Alignment", "Repetition", "White space"], "ans": [0], "part": 1}, {"q": "What is the color balance setting on a digital camera called?", "opts": ["Depth of field", "Frame balance", "White balance", "Rule of thirds"], "ans": [2], "part": 1}, {"q": "Which design principle places related elements close together?", "opts": ["Cropping", "Framing", "Resampling", "Proximity"], "ans": [3], "part": 1}, {"q": "What defines form in a two-dimensional image?", "opts": ["Texture and shape", "Contrast and tone", "Lines and texture", "Light and shadow"], "ans": [3], "part": 2}, {"q": "Which basic design element is primarily made up of lines?", "opts": ["Shape", "Texture", "Contrast", "Form", "Color theory"], "ans": [0], "part": 2}, {"q": "When pasting content from another application into Photoshop, which Paste As options are available? Choose three.", "opts": ["Pixels", "Vector", "Smart Object", "Paths", "SVG", "Mask"], "ans": [0, 2, 3], "part": 2}, {"q": "Which are types of gradients available in Photoshop? Choose three.", "opts": ["Angle", "Linear", "Symmetrical", "Rounded", "Diamond"], "ans": [0, 1, 4], "part": 2}, {"q": "Which commercial color library is widely used in graphic design and printing?", "opts": ["PANTONE", "HSK", "Epson", "DCIM"], "ans": [0], "part": 2}, {"q": "Which gradient control defines where the transition between two colors is balanced?", "opts": ["Noise", "Color wheel", "Opacity stop", "Color midpoint"], "ans": [3], "part": 2}, {"q": "Which two methods can display the Brushes panel?", "opts": ["Window > Workspace > Painting", "Window > Brushes", "Select Brush tool (B) only", "Select Brush Preset in Properties", "Select Brush icon in Layers", "Select History Brush (Y)"], "ans": [0, 1], "part": 2}, {"q": "Which keyboard shortcut activates Free Transform for scaling an embedded Smart Object on Windows?", "opts": ["Ctrl+T", "Ctrl+B", "Ctrl+A", "Ctrl+S"], "ans": [0], "part": 2}, {"q": "In Free Transform mode, which control bends or warps an object?", "opts": ["Commit transform checkmark", "Warp icon in Options bar", "Cancel transform", "Lock proportions"], "ans": [1], "part": 2}, {"q": "How do you swap width and height while using the Crop tool?", "opts": ["Select the Crop tool, click the swap arrows in the Options bar, then confirm", "Use the Eraser tool and press Enter", "Choose Filter > Blur", "Press Ctrl+S to swap values"], "ans": [0], "part": 2}, {"q": "Which tool makes drawing curved vector paths easier?", "opts": ["Delete Anchor Point tool", "Perspective Crop tool", "Curvature Pen tool", "Color Replacement tool"], "ans": [2], "part": 2}, {"q": "Which eraser tool removes similarly colored pixels when clicked?", "opts": ["Eraser Tool", "Background Eraser Tool", "Magic Eraser Tool", "History Brush Tool"], "ans": [2], "part": 2}, {"q": "What is the color balance setting on a digital camera called?", "opts": ["Rule of thirds", "Frame balance", "Depth of field", "White balance"], "ans": [3], "part": 2}, {"q": "Which design principle describes placing related elements close to one another?", "opts": ["Framing", "Cropping", "Resampling", "Rule of thirds", "Proximity"], "ans": [4], "part": 2}, {"q": "Which principle uses consistent recurring elements to establish a visual pattern or theme?", "opts": ["Rhythm", "Focal point", "Emphasis", "Unity"], "ans": [0], "part": 2}, {"q": "Which term describes the space between lines of type?", "opts": ["Kerning", "Tracking", "Leading", "Type Style"], "ans": [2], "part": 2}, {"q": "Which term describes the space between two specific characters?", "opts": ["Leading", "Kerning", "Tracking", "Type Style"], "ans": [1], "part": 2}, {"q": "Which term describes spacing across a range of characters?", "opts": ["Leading", "Kerning", "Tracking", "Type Style"], "ans": [2], "part": 2}, {"q": "Which are types of lines? Choose three.", "opts": ["Straight", "Textured", "Rectilinear", "Contrasting", "Curvilinear"], "ans": [0, 2, 4], "part": 2}, {"q": "Which composition guideline divides an image using two horizontal and two vertical lines?", "opts": ["Framing", "Field of view", "Focal point", "Space", "Rule of thirds"], "ans": [4], "part": 2}, {"q": "Which design principle refers to the justification or positioning of objects or text?", "opts": ["Alignment", "Repetition", "Balance", "Harmony", "White space"], "ans": [0], "part": 2}, {"q": "Which colors are located opposite each other on the color wheel?", "opts": ["Analogous", "Harmonious", "Complementary", "Contrasting"], "ans": [2], "part": 2}, {"q": "Which term describes a variation of a typeface such as bold, italic, or regular?", "opts": ["Tracking", "Leading", "Type Style", "Kerning"], "ans": [2], "part": 2}, {"q": "Which action temporarily disables a layer mask in Photoshop?", "opts": ["Shift-click the mask thumbnail", "Ctrl+Shift+I", "Ctrl+Shift+M", "Ctrl+Shift+H"], "ans": [0], "part": 3}, {"q": "Which File menu command lets you modify document copyright and author metadata?", "opts": ["File > Export", "File > File Info", "File > Automate", "File > Print"], "ans": [1], "part": 3}, {"q": "Before completing a Photoshop project, which three items should be reviewed?", "opts": ["Swatches", "Dimensions and resolution", "Color mode", "Layer count", "Metadata"], "ans": [1, 2, 4], "part": 3}, {"q": "In Photoshop print settings, which Color Handling choice assigns color management to Photoshop?", "opts": ["Printer Manages Colors", "Photoshop Manages Colors", "No Color Management", "Convert to Grayscale"], "ans": [1], "part": 3}, {"q": "Which three are benefits of cloud file storage?", "opts": ["Autosave support", "Files are easily lost", "Files can be hacked", "Version history", "Sharing and access for collaborators"], "ans": [0, 3, 4], "part": 3}, {"q": "What is an iterative sketch?", "opts": ["A rough design concept revised over time", "A fixed project framework", "A final approved design", "A completed production file"], "ans": [0], "part": 3}, {"q": "Which three are technical or output requirements to consider in a design project?", "opts": ["Deliverables", "Resolution or DPI", "File types", "Company protocol", "Employee attendance"], "ans": [0, 1, 2], "part": 3}, {"q": "A feedback ______ describes a repeated cycle of receiving feedback and revising a design.", "opts": ["protocol", "form", "loop", "requirement"], "ans": [2], "part": 3}, {"q": "Which is NOT a standard project production phase?", "opts": ["Budget discussion", "Testing", "Planning and analysis", "Publishing"], "ans": [0], "part": 3}, {"q": "Which four factors may be documented in a project plan?", "opts": ["Statement", "Outcome", "Demographics", "Benchmarks", "Roles", "Scope"], "ans": [2, 3, 4, 5], "part": 3}, {"q": "Which three are appropriate sources of project feedback?", "opts": ["Peers", "Client", "Family", "Teammates", "Unmoderated internet comments"], "ans": [0, 1, 3], "part": 3}, {"q": "Which color mode is most commonly used for web and video graphics?", "opts": ["Grayscale", "Multichannel", "CMYK", "RGB (Red-Green-Blue)"], "ans": [3], "part": 3}, {"q": "Which two effects of scope creep should stakeholders discuss?", "opts": ["Separate accounts for new expectations", "Reduced quality as a requirement", "Additional resources", "Additional time"], "ans": [2, 3], "part": 3}, {"q": "Which Photoshop panel lists the document layers, including shape layers and masks?", "opts": ["Adjustments", "Layers", "History", "Info"], "ans": [1], "part": 3}, {"q": "Which shortcut activates the Brush tool in Photoshop?", "opts": ["Shift+B", "Ctrl", "B", "Ctrl+Shift+B"], "ans": [2], "part": 3}, {"q": "What is the visible working area of a Photoshop document called?", "opts": ["Workspace", "Artboard only", "Canvas", "Tab"], "ans": [2], "part": 3}, {"q": "Which three actions can customize the layout of Photoshop panels?", "opts": ["Nest or dock them", "Show them", "Report them", "Cast them", "Separate or undock them"], "ans": [0, 1, 4], "part": 3}, {"q": "Under which Preferences category can you adjust Photoshop memory usage?", "opts": ["Units & Rulers", "Interface", "Performance", "Guides, Grid & Slices"], "ans": [2], "part": 3}, {"q": "Which panel is used to adjust typography properties such as font, size and tracking?", "opts": ["Tools", "Info", "Brushes", "Character"], "ans": [3], "part": 3}, {"q": "Where can you change the blend mode of a selected Photoshop layer?", "opts": ["Paths panel", "Libraries panel", "Blend Mode dropdown in the Layers panel", "History panel"], "ans": [2], "part": 3}, {"q": "Which statements describe valid uses of the Lasso Tool? Select all that apply.", "opts": ["Make a non-geometric selection", "Select an area before Content-Aware Fill", "Group objects from separate layers", "Select an area to remove from an image"], "ans": [0, 1, 3], "part": 4}, {"q": "Which action temporarily disables a layer mask?", "opts": ["Shift-click the mask thumbnail", "Ctrl+Shift+I", "Ctrl+Shift+M", "Ctrl+Shift+H"], "ans": [0], "part": 4}, {"q": "Which three features can establish hierarchy in text?", "opts": ["Fonts", "Rasterization", "Size", "Colors"], "ans": [0, 2, 3], "part": 4}, {"q": "What does kerning control?", "opts": ["Space between specific character pairs", "Distance between lines of text", "Spacing across a selected range of characters", "Thickness of a font"], "ans": [0], "part": 4}, {"q": "What is the best definition of typography?", "opts": ["Emphasizing important text through layout", "The art of arranging type using fonts, styles, and other properties", "The emotional feeling conveyed by a font", "Aligning text to a document grid"], "ans": [1], "part": 4}, {"q": "Which is a serif font?", "opts": ["Tahoma", "Times New Roman", "Calibri", "Arial"], "ans": [1], "part": 4}, {"q": "Which term describes the space between two specific characters?", "opts": ["Kerning", "Alignment", "Tracking", "Leading"], "ans": [0], "part": 4}, {"q": "According to the supplied practice question, which action scales a bounding box proportionately?", "opts": ["Ctrl-click a side and drag", "Ctrl+J", "Shift-drag a corner handle", "Ctrl+Alt-click a side and drag"], "ans": [2], "part": 4}, {"q": "Before completing a Photoshop project, which three items should be reviewed?", "opts": ["Color mode", "Swatches", "Metadata", "Dimensions and resolution"], "ans": [0, 2, 3], "part": 4}, {"q": "Which three adjustments can be made using adjustment layers?", "opts": ["Temperature via a suitable adjustment", "Curves", "Aperture", "Brightness and contrast"], "ans": [0, 1, 3], "part": 4}, {"q": "Which operations are generally non-destructive? Select all that apply.", "opts": ["Using a layer mask", "Using adjustment layers", "Directly applying Image > Adjustments to pixels", "Transforming a Smart Object"], "ans": [0, 1, 3], "part": 4}, {"q": "How can you apply a filter to a text layer while keeping the type editable?", "opts": ["Rasterize the type layer", "Save only as JPEG", "Convert the type layer to a Smart Object", "Flatten the document"], "ans": [2], "part": 4}, {"q": "What editing approach preserves original image data?", "opts": ["Non-destructive editing", "Destructive editing", "Flattened editing", "Permanent pixel editing"], "ans": [0], "part": 4}, {"q": "Which technique changes an image without overwriting original pixel data?", "opts": ["Direct pixel painting", "Destructive retouching", "Non-destructive editing", "Flattening layers"], "ans": [2], "part": 4}, {"q": "Rasterizing vector content converts it into which type of content?", "opts": ["Editable vector paths", "Pixels", "Live text", "Smart guides"], "ans": [1], "part": 4}, {"q": "Which Photoshop feature retains an image’s source content for non-destructive transformations?", "opts": ["Content-Aware Fill", "History panel", "Smart Objects", "Magic Wand"], "ans": [2], "part": 4}, {"q": "Which operations are generally destructive when applied directly to a pixel layer? Select all that apply.", "opts": ["Image > Adjustments", "Clone Stamp directly on original pixels", "Using a layer mask", "Rasterizing vector artwork"], "ans": [0, 1, 3], "part": 4}, {"q": "Which command is intended to change a photo’s sky?", "opts": ["Magic Wand", "Sky Replacement", "Paste Special", "Perspective Warp"], "ans": [1], "part": 4}, {"q": "Which is NOT a selection method in Photoshop?", "opts": ["Magic Wand", "Lasso", "Hand Tool", "Quick Selection"], "ans": [2], "part": 4}, {"q": "Which term means spacing between lines of text?", "opts": ["Tracking", "Leading", "Kerning", "Baseline"], "ans": [1], "part": 4}];const root=document.getElementById('quiz');qs.forEach((q,i)=>{const div=document.createElement('section');div.className='question';div.dataset.index=i;const multi=q.ans.length>1;const title=document.createElement('h2');title.textContent=(i+1)+'. '+q.q;const tag=document.createElement('div');tag.className='tag';tag.textContent='Part '+q.part+' • Question '+(i+1);const ins=document.createElement('p');ins.className='instruction';ins.textContent=multi?'Select all correct answers ('+q.ans.length+').':'Choose one answer.';div.append(tag,title,ins);q.opts.forEach((o,j)=>{const lab=document.createElement('label');lab.className='option';const inp=document.createElement('input');inp.type=multi?'checkbox':'radio';inp.name='q'+i;inp.value=j;inp.addEventListener('change',progress);const span=document.createElement('span');span.textContent=String.fromCharCode(65+j)+'. '+o;lab.append(inp,span);div.append(lab)});const feed=document.createElement('div');feed.className='feedback';div.append(feed);root.append(div)});function selected(div){return [...div.querySelectorAll('input:checked')].map(x=>Number(x.value))}
function incomplete(){return [...document.querySelectorAll('.question')].filter((div,i)=>selected(div).length!==qs[i].ans.length)}
function progress(){
  let complete=qs.length-incomplete().length;
  document.getElementById('progress').textContent=complete+' / '+qs.length+' complete';
  document.getElementById('fill').style.width=(complete/qs.length*100)+'%';
  const notice=document.getElementById('result');
  if(notice.dataset.graded==='true'){
    notice.dataset.graded='false';notice.textContent='Answers changed. Submit again to see your updated score.';
    document.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));
    document.querySelectorAll('.feedback').forEach(x=>{x.textContent='';x.className='feedback'});
  }
}
function grade(){
  const pending=incomplete();
  const result=document.getElementById('result');
  if(pending.length){
    const nums=pending.map(div=>Number(div.dataset.index)+1);
    result.dataset.graded='false';
    result.textContent='Please finish '+pending.length+' question(s) before submitting. Each question needs the indicated number of answers. Incomplete: '+nums.join(', ')+'.';
    pending.forEach(div=>{const f=div.querySelector('.feedback');f.className='feedback bad';f.textContent='Select '+qs[Number(div.dataset.index)].ans.length+' answer(s) to complete this question.'});
    pending[0].scrollIntoView({behavior:'smooth',block:'center'});
    pending[0].querySelector('input').focus({preventScroll:true});
    return;
  }
  let score=0;
  document.querySelectorAll('.question').forEach((div,i)=>{
    const q=qs[i],chosen=selected(div);
    const ok=chosen.length===q.ans.length&&q.ans.every(x=>chosen.includes(x));
    if(ok)score++;
    div.querySelectorAll('.option').forEach((lab,j)=>{
      lab.classList.toggle('correct',q.ans.includes(j));
      lab.classList.toggle('wrong',chosen.includes(j)&&!q.ans.includes(j));
    });
    const feed=div.querySelector('.feedback');
    feed.className='feedback '+(ok?'ok':'bad');
    feed.textContent=(ok?'✓ Correct':'✗ Incorrect')+' — Answer: '+q.ans.map(j=>String.fromCharCode(65+j)).join(', ');
  });
  result.dataset.graded='true';
  result.textContent='Your score: '+score+' / '+qs.length+' ('+Math.round(100*score/qs.length)+'%). Green highlights show correct choices; red highlights show incorrect selections.';
  result.scrollIntoView({behavior:'smooth',block:'center'});
}
function resetTest(){
  document.querySelectorAll('input').forEach(x=>x.checked=false);
  document.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));
  document.querySelectorAll('.feedback').forEach(x=>{x.textContent='';x.className='feedback'});
  const result=document.getElementById('result');result.textContent='';result.dataset.graded='false';
  progress();window.scrollTo({top:0,behavior:'smooth'});
}
progress();</script></body></html>
